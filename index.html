<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Airfryer Rechner</title>
  
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Airfryer">
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
        --bg-color: #121212;
        --container-bg: #1e1e1e;
        --card-bg: #252525;
        --box-bg: #2a2a2a;
        --text-main: #e0e0e0;
        --text-muted: #9e9e9e;
        --accent: #f5c518;
        --border: #333333;
    }

    html, body {
        width: 100%; height: 100%; margin: 0; padding: 0;
        background-color: var(--bg-color); overflow-x: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text-main); display: flex; justify-content: center;
        align-items: flex-start; box-sizing: border-box; overscroll-behavior-y: none;
    }

    .container {
        background-color: var(--container-bg); width: 100%;
        min-height: 100vh; min-height: -webkit-fill-available;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top));
        padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
        padding-left: calc(24px + env(safe-area-inset-left));
        padding-right: calc(24px + env(safe-area-inset-right));
        box-sizing: border-box; display: flex; flex-direction: column;
    }

    .view { display: none; flex-direction: column; flex: 1; }
    .view.active { display: flex; }

    .app-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 25px; }
    .app-logo { width: 36px; height: 36px; object-fit: contain; }
    h2 { margin: 0; font-size: 1.5rem; font-weight: 600; }

    .btn {
        background: var(--box-bg); color: var(--text-main); border: 1px solid var(--border);
        padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 600;
        cursor: pointer; text-align: center; width: 100%; margin-top: 15px;
    }
    .btn-primary { background: var(--accent); color: #000; border: none; }
    .btn-small { padding: 8px 16px; width: auto; margin-top: 0; }

    .form-group { margin-bottom: 25px; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    label { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; }
    
    input[type=text], textarea {
        width: 100%; background: var(--box-bg); border: 1px solid var(--border);
        color: var(--text-main); padding: 14px; border-radius: 8px; font-size: 1rem; box-sizing: border-box;
    }
    input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent); }

    .native-select {
        appearance: none; -webkit-appearance: none; background: var(--box-bg);
        color: var(--text-main); border: 1px solid var(--border); padding: 14px 16px;
        border-radius: 8px; font-size: 1.1rem; font-weight: 600; width: 100%; cursor: pointer; text-align: center;
    }
    .native-select:focus { outline: none; border-color: var(--accent); color: var(--accent); }

    /* Horizontale Chips */
    .chips-wrapper {
        display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; margin-bottom: 15px;
        scrollbar-width: none; 
    }
    .chips-wrapper::-webkit-scrollbar { display: none; } 
    
    .chip {
        background: var(--box-bg); border: 1px solid var(--border); color: var(--text-muted);
        padding: 10px 18px; border-radius: 20px; white-space: nowrap; font-size: 0.95rem;
        font-weight: 500; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .chip.active { background: rgba(245, 197, 24, 0.1); border-color: var(--accent); color: var(--accent); }
    .chip-new { border-style: dashed; color: var(--text-main); }

    /* Sliders */
    .value-display {
        font-size: 1.1rem; font-weight: 600; color: var(--text-main); background: var(--bg-color);
        padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); min-width: 70px; text-align: center;
    }
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%;
        background: var(--accent); cursor: pointer; margin-top: -12px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 5px; cursor: pointer; background: var(--border); border-radius: 2px;
    }

    /* Listen-Ansicht */
    .recipe-list { display: flex; flex-direction: column; gap: 10px; }
    .recipe-card-simple {
        background: var(--box-bg); border: 1px solid var(--border); border-radius: 10px;
        padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }
    .recipe-card-simple h4 { margin: 0; font-size: 1.1rem; color: var(--text-main); }
    .recipe-card-simple p { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }
    .chevron { color: var(--text-muted); font-size: 1.2rem; }

    /* Große Karte (Rechner & Detail) */
    .airfryer-result-card { background: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; margin-bottom: 25px; }
    .subtitle { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase; }
    .title { margin: 0 0 20px 0; font-size: 28px; color: var(--accent); }
    .stats-grid { display: flex; gap: 16px; }
    .stat-box { flex: 1; background: var(--box-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 500; }
    .stat-value { font-size: 26px; font-weight: 700; color: var(--text-main); display: flex; align-items: baseline; gap: 4px; }
    .stat-value span { font-size: 15px; font-weight: 500; color: var(--text-muted); }
    
    .toggle-buttons { display: flex; background: var(--box-bg); padding: 4px; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--border); }
    .toggle-buttons button { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; font-weight: 500; color: var(--text-muted); }
    .toggle-buttons button.active { background: var(--container-bg); color: var(--text-main); border: 1px solid var(--border); }

    /* Bottom Tab Bar */
    .tab-bar {
        position: fixed; bottom: 0; left: 0; width: 100%; background: var(--container-bg); border-top: 1px solid var(--border);
        display: flex; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
    }
    .tab-bar button {
        flex: 1; background: transparent; border: none; padding: 16px 0; color: var(--text-muted);
        font-size: 0.8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    }
    .tab-bar button.active { color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    <div class="app-header">
      <img src="icon.png" alt="Logo" class="app-logo">
      <h2>Airfryer OS</h2>
    </div>

    <!-- VIEW 1: RECHNER -->
    <div id="view-calc" class="view active">
      <div class="airfryer-result-card">
        <div class="subtitle">Airfryer Programm</div>
        <h1 class="title" id="resProgramName">Air Fry</h1>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">TEMPERATUR</div>
            <div class="stat-value" id="resTemp">185<span>°C</span></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">ZEIT</div>
            <div class="stat-value" id="resTime">24<span>min</span></div>
          </div>
        </div>
      </div>
      
      <div class="toggle-buttons">
        <button class="active" id="btnUmluft" onclick="setCalcProgram('umluft')">Umluft</button>
        <button id="btnOberUnter" onclick="setCalcProgram('oberunter')">Ober-/Unterhitze</button>
      </div>

      <div class="form-group">
        <div class="header-row">
          <label>Backofen-Temperatur</label>
          <span class="value-display" id="tempDisplay">200 °C</span>
        </div>
        <input type="range" id="ovenTemp" value="200" min="50" max="300" step="5" oninput="updateCalcUI()">
      </div>
      <div class="form-group">
        <div class="header-row">
          <label>Backofen-Garzeit</label>
          <span class="value-display" id="timeDisplay">30 Min.</span>
        </div>
        <input type="range" id="ovenTime" value="30" min="1" max="240" step="1" oninput="updateCalcUI()">
      </div>

      <button class="btn btn-primary" onclick="transferToForm()">Als Gericht speichern</button>
    </div>

    <!-- VIEW 2: MEINE GERICHTE (Liste) -->
    <div id="view-list" class="view">
      <div class="header-row">
        <h3 style="margin:0;">Gespeichert</h3>
        <button class="btn btn-primary btn-small" onclick="openForm()">+ Neu</button>
      </div>
      
      <!-- Filter Chips -->
      <div class="chips-wrapper" id="listChips"></div>

      <!-- Namensliste -->
      <div class="recipe-list" id="recipeListContainer"></div>
    </div>

    <!-- VIEW 3: DETAIL (Ablese-Modus) -->
    <div id="view-detail" class="view">
      <div class="header-row" style="margin-bottom: 20px;">
        <button class="btn btn-small" style="margin:0; background:transparent;" onclick="switchTab('list')">← Zurück</button>
      </div>
      
      <h3 id="detailName" style="margin-top:0; margin-bottom: 20px; font-size: 1.6rem;">McCain Pommes</h3>
      
      <div class="airfryer-result-card" style="margin-bottom: 20px;">
        <div class="subtitle">Programm</div>
        <h1 class="title" id="detailProgram">Air Fry</h1>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">TEMPERATUR</div>
            <div class="stat-value" id="detailTemp">195<span>°C</span></div>
          </div>
          <div class="stat-box">
            <div class="stat-label">ZEIT</div>
            <div class="stat-value" id="detailTime">22<span>min</span></div>
          </div>
        </div>
      </div>
      
      <input type="hidden" id="currentDetailId">
      <button class="btn btn-primary" onclick="openFormFromDetail()">Werte anpassen</button>
    </div>

    <!-- VIEW 4: FORMULAR (Bearbeiten) -->
    <div id="view-form" class="view">
      <h3 id="formTitle" style="margin-top:0;">Neues Gericht</h3>
      
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="recipeName" placeholder="z.B. McCain Chef Frites">
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom: 8px;">Kategorie</label>
        <div class="chips-wrapper" id="formChips"></div>
      </div>

      <div class="form-group">
        <label style="display:block; margin-bottom: 8px;">Programm</label>
        <select id="recipeProgram" class="native-select">
          <option value="Air Fry">Air Fry</option>
          <option value="Bake">Bake</option>
          <option value="Roast">Roast</option>
          <option value="Grill">Grill</option>
          <option value="Reheat">Reheat</option>
          <option value="Dry">Dry</option>
        </select>
      </div>

      <div class="form-group">
        <div class="header-row">
          <label>Temperatur</label>
          <span class="value-display" id="formTempDisplay">195 °C</span>
        </div>
        <input type="range" id="recipeTemp" value="195" min="50" max="240" step="5" oninput="document.getElementById('formTempDisplay').textContent = this.value + ' °C'">
      </div>

      <div class="form-group">
        <div class="header-row">
          <label>Dauer</label>
          <span class="value-display" id="formTimeDisplay">20 Min.</span>
        </div>
        <input type="range" id="recipeTime" value="20" min="1" max="120" step="1" oninput="document.getElementById('formTimeDisplay').textContent = this.value + ' Min.'">
      </div>

      <input type="hidden" id="recipeId">
      
      <div style="display: flex; gap: 10px; margin-top: auto;">
        <button class="btn" style="flex:1;" onclick="switchTab('list')">Abbrechen</button>
        <button class="btn btn-primary" style="flex:2;" onclick="saveRecipe()">Speichern</button>
      </div>
      <button class="btn" id="btnDelete" style="background:#3a1c1c; border-color:#5c2b2b; color:#ff6b6b; display:none;" onclick="deleteRecipe()">Eintrag löschen</button>
    </div>

    <!-- VIEW 5: BACKUP -->
    <div id="view-settings" class="view">
      <h3 style="margin-top:0;">JSON Backup</h3>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Kopiere deine Daten als Textblock für deine Notizen.</p>
      <textarea id="backupTextarea" rows="10" placeholder="Daten hier einfügen..."></textarea>
      <button class="btn btn-primary" onclick="exportJSON()">Kopieren (Export)</button>
      <button class="btn" onclick="importJSON()">Einfügen (Import)</button>
    </div>

  </div>

  <!-- Bottom Navigation -->
  <div class="tab-bar">
    <button id="tab-calc" class="active" onclick="switchTab('calc')">Rechner</button>
    <button id="tab-list" onclick="switchTab('list')">Gerichte</button>
    <button id="tab-settings" onclick="switchTab('settings')">Backup</button>
  </div>

  <script>
    // --- DATEN & STATE ---
    let recipes = JSON.parse(localStorage.getItem('af_recipes')) || [];
    let categories = JSON.parse(localStorage.getItem('af_categories')) || ['🍟 Pommes', '🥦 Gemüse', '🍗 Fleisch', '🥐 Backwaren'];
    let selectedCategory = categories[0];
    let listFilterCategory = 'Alle';
    
    // --- TAB NAVIGATION ---
    function switchTab(tabId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
      
      const targetView = (tabId === 'form' || tabId === 'detail') ? tabId : tabId;
      document.getElementById('view-' + targetView).classList.add('active');
      
      if(tabId !== 'form' && tabId !== 'detail') {
        document.getElementById('tab-' + tabId).classList.add('active');
      }

      if(tabId === 'list') {
        renderListChips();
        renderList();
      }
      if(tabId === 'settings') prepareBackupView();
    }

    // --- MEINE GERICHTE (LISTE & FILTER) ---
    function renderListChips() {
      const container = document.getElementById('listChips');
      container.innerHTML = '';
      
      const filterOptions = ['Alle', ...categories];
      
      filterOptions.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'chip ' + (listFilterCategory === cat ? 'active' : '');
        div.textContent = cat;
        div.onclick = () => { listFilterCategory = cat; renderListChips(); renderList(); };
        container.appendChild(div);
      });
    }

    function renderList() {
      const container = document.getElementById('recipeListContainer');
      container.innerHTML = '';
      
      let filteredRecipes = recipes;
      if (listFilterCategory !== 'Alle') {
        filteredRecipes = recipes.filter(r => r.category === listFilterCategory);
      }
      
      if (filteredRecipes.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Keine Einträge gefunden.</p>';
        return;
      }

      filteredRecipes.forEach(r => {
        const div = document.createElement('div');
        div.className = 'recipe-card-simple';
        div.onclick = () => openDetail(r.id);
        div.innerHTML = `
          <div>
            <h4>${r.name}</h4>
            <p>${r.category}</p>
          </div>
          <div class="chevron">›</div>
        `;
        container.appendChild(div);
      });
    }

    // --- ABLESE-MODUS (DETAIL) ---
    function openDetail(id) {
      const r = recipes.find(x => x.id === id);
      if(!r) return;
      
      document.getElementById('detailName').textContent = r.name;
      document.getElementById('detailProgram').textContent = r.program;
      document.getElementById('detailTemp').innerHTML = `${r.temp}<span>°C</span>`;
      document.getElementById('detailTime').innerHTML = `${r.time}<span>min</span>`;
      document.getElementById('currentDetailId').value = r.id;
      
      switchTab('detail');
    }

    function openFormFromDetail() {
      openForm(document.getElementById('currentDetailId').value);
    }

    // --- FORMULAR LOGIK ---
    function renderFormChips() {
      const container = document.getElementById('formChips');
      container.innerHTML = '';
      
      categories.forEach(cat => {
        const div = document.createElement('div');
        div.className = 'chip ' + (selectedCategory === cat ? 'active' : '');
        div.textContent = cat;
        div.onclick = () => { selectedCategory = cat; renderFormChips(); };
        container.appendChild(div);
      });

      const btnNew = document.createElement('div');
      btnNew.className = 'chip chip-new';
      btnNew.textContent = '+ Neu';
      btnNew.onclick = () => {
        const newCat = prompt('Neue Kategorie (ggf. mit Emoji):');
        if (newCat && newCat.trim() !== '') {
          categories.push(newCat.trim());
          localStorage.setItem('af_categories', JSON.stringify(categories));
          selectedCategory = newCat.trim();
          renderFormChips();
        }
      };
      container.appendChild(btnNew);
    }

    function openForm(id = null) {
      document.getElementById('formTitle').textContent = id ? 'Werte anpassen' : 'Neues Gericht';
      document.getElementById('btnDelete').style.display = id ? 'block' : 'none';
      
      if (id) {
        const r = recipes.find(x => x.id === id);
        document.getElementById('recipeId').value = r.id;
        document.getElementById('recipeName').value = r.name;
        document.getElementById('recipeProgram').value = r.program;
        document.getElementById('recipeTemp').value = r.temp;
        document.getElementById('recipeTime').value = r.time;
        selectedCategory = r.category;
      } else {
        document.getElementById('recipeId').value = '';
        document.getElementById('recipeName').value = '';
        selectedCategory = categories[0];
      }
      
      document.getElementById('formTempDisplay').textContent = document.getElementById('recipeTemp').value + ' °C';
      document.getElementById('formTimeDisplay').textContent = document.getElementById('recipeTime').value + ' Min.';
      
      renderFormChips();
      switchTab('form');
    }

    function saveRecipe() {
      const name = document.getElementById('recipeName').value.trim();
      if (!name) { alert('Bitte einen Namen eingeben.'); return; }

      const id = document.getElementById('recipeId').value;
      const data = {
        id: id || Date.now().toString(),
        name: name,
        category: selectedCategory,
        program: document.getElementById('recipeProgram').value,
        temp: parseInt(document.getElementById('recipeTemp').value),
        time: parseInt(document.getElementById('recipeTime').value)
      };

      if (id) {
        const idx = recipes.findIndex(x => x.id === id);
        recipes[idx] = data;
      } else {
        recipes.push(data);
      }

      localStorage.setItem('af_recipes', JSON.stringify(recipes));
      
      // Nach dem Speichern: Gehe zur Detail-Ansicht des gespeicherten Gerichts
      openDetail(data.id);
    }

    function deleteRecipe() {
      if(confirm('Gericht wirklich löschen?')) {
        const id = document.getElementById('recipeId').value;
        recipes = recipes.filter(x => x.id !== id);
        localStorage.setItem('af_recipes', JSON.stringify(recipes));
        switchTab('list');
      }
    }

    function transferToForm() {
      const calcProg = document.getElementById('resProgramName').textContent;
      const calcTemp = document.getElementById('resTemp').innerText.replace('°C','');
      const calcTime = document.getElementById('resTime').innerText.replace('min','');
      
      openForm();
      document.getElementById('recipeProgram').value = calcProg;
      document.getElementById('recipeTemp').value = calcTemp;
      document.getElementById('recipeTime').value = calcTime;
      
      document.getElementById('formTempDisplay').textContent = calcTemp + ' °C';
      document.getElementById('formTimeDisplay').textContent = calcTime + ' Min.';
    }

    // --- BACKUP ---
    function prepareBackupView() {
      const exportData = { categories, recipes };
      document.getElementById('backupTextarea').value = JSON.stringify(exportData, null, 2);
    }
    function exportJSON() {
      const ta = document.getElementById('backupTextarea');
      ta.select(); document.execCommand('copy');
      alert('Kopiert! Du kannst es jetzt in Obsidian als Backup ablegen.');
    }
    function importJSON() {
      try {
        const val = document.getElementById('backupTextarea').value;
        const data = JSON.parse(val);
        if (data.categories && data.recipes) {
          categories = data.categories; recipes = data.recipes;
          localStorage.setItem('af_categories', JSON.stringify(categories));
          localStorage.setItem('af_recipes', JSON.stringify(recipes));
          alert('Daten erfolgreich importiert!'); switchTab('list');
        } else { alert('Ungültiges Format.'); }
      } catch(e) { alert('Fehler beim Import.'); }
    }

    // --- RECHNER LOGIK ---
    let isUmluft = true;
    function setCalcProgram(type) {
      isUmluft = (type === 'umluft');
      document.getElementById('btnUmluft').classList.toggle('active', isUmluft);
      document.getElementById('btnOberUnter').classList.toggle('active', !isUmluft);
      updateCalcUI();
    }
    
    function updateCalcUI() {
      const ovenTemp = parseInt(document.getElementById('ovenTemp').value);
      const ovenTime = parseInt(document.getElementById('ovenTime').value);
      document.getElementById('tempDisplay').textContent = ovenTemp + " °C";
      document.getElementById('timeDisplay').textContent = ovenTime + " Min.";

      let afTemp = isUmluft ? ovenTemp - 15 : ovenTemp - 35;
      let afTime = Math.round(ovenTime * (isUmluft ? 0.80 : 0.75));

      let program = "";
      if (afTemp <= 95) { program = "Dry"; afTime = Math.max(afTime, 30); }
      else if (afTemp <= 119) { program = "Reheat"; afTime = Math.min(afTime, 60); }
      else if (afTemp <= 204) { program = afTime > 60 ? "Bake" : "Air Fry"; afTime = Math.min(afTime, 240); }
      else if (afTemp <= 220) { program = "Roast"; afTime = Math.min(afTime, 60); }
      else { program = "Grill"; afTemp = Math.min(afTemp, 230); afTime = Math.min(afTime, 60); }

      document.getElementById('resProgramName').textContent = program;
      document.getElementById('resTemp').innerHTML = `${afTemp}<span>°C</span>`;
      document.getElementById('resTime').innerHTML = `${afTime}<span>min</span>`;
    }
    
    updateCalcUI();
  </script>
</body>
</html>
